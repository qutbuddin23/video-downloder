name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ccache

      - name: Cache Buildozer, Android SDK, and NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.gradle
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install --upgrade "buildozer>=1.5.0" "Cython<3.0" virtualenv

      - name: Build Android APK
        run: |
          export USE_CCACHE=1
          yes | buildozer -v android debug || {
            echo "================ BUILDOZER LOG SUMMARY ================"
            find .buildozer -name "*.log" -exec tail -n 150 {} +
            exit 1
          }

      - name: Sign APK with Custom Developer Certificate
        run: |
          keytool -genkey -v -keystore release.keystore -alias appkey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=UniversalDownloader, OU=Dev, O=AppStudio, L=Global, S=State, C=US"
          for apk in bin/*.apk; do
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass 123456 "$apk" appkey
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-APK
          path: bin/*.apk
